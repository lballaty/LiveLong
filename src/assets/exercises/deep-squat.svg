<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="exercise-svg">
  <defs>
    <!-- Figure gradient -->
    <linearGradient id="figureGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>

    <!-- Progress gradient -->
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#81C784"/>
    </linearGradient>

    <!-- Breathing indicator -->
    <radialGradient id="breathIndicator" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E1F5FE;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#FAFAFA" rx="8"/>

  <!-- Exercise title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#333">
    Deep Squat — Shinku Zuwari
  </text>

  <!-- Timer display (top right) -->
  <g id="timerDisplay" transform="translate(350, 50)">
    <circle cx="0" cy="0" r="25" fill="#FFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" id="timer">120</text>
    <text x="0" y="-15" text-anchor="middle" font-size="10" fill="#666">Seconds</text>
  </g>

  <!-- Rep counter (top left) -->
  <g id="repCounter" transform="translate(50, 50)">
    <rect x="-35" y="-20" width="70" height="40" rx="20" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
      <tspan id="currentRep">0</tspan><tspan> / </tspan><tspan id="targetReps">5</tspan>
    </text>
    <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#666">Squats</text>
  </g>

  <!-- Breathing indicator -->
  <g id="breathingIndicator" transform="translate(200, 60)">
    <circle cx="0" cy="0" r="15" fill="url(#breathIndicator)" id="breathCircle" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#0288D1" id="breathText">
      Hold
    </text>
  </g>

  <!-- Main figure in squat position -->
  <g id="squatFigure" transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-80" r="16" fill="url(#figureGradient)" stroke="#4CAF50" stroke-width="2"/>

    <!-- Body/torso -->
    <ellipse cx="0" cy="-45" rx="20" ry="25" fill="url(#figureGradient)" stroke="#4CAF50" stroke-width="2"/>

    <!-- Arms (hanging naturally) -->
    <line x1="-15" y1="-55" x2="-30" y2="-25" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="-55" x2="30" y2="-25" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>

    <!-- Hands -->
    <circle cx="-30" cy="-25" r="5" fill="#FFCC80" stroke="#F57C00" stroke-width="2"/>
    <circle cx="30" cy="-25" r="5" fill="#FFCC80" stroke="#F57C00" stroke-width="2"/>

    <!-- Thighs (squat position) -->
    <line x1="-8" y1="-25" x2="-25" y2="10" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="-25" x2="25" y2="10" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>

    <!-- Calves -->
    <line x1="-25" y1="10" x2="-25" y2="40" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="10" x2="25" y2="40" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>

    <!-- Feet (wider stance) -->
    <ellipse cx="-25" cy="45" rx="15" ry="6" fill="#333"/>
    <ellipse cx="25" cy="45" rx="15" ry="6" fill="#333"/>

    <!-- Balance indicators (heels down emphasis) -->
    <circle cx="-35" cy="45" r="3" fill="#FF6B35" id="leftHeel"/>
    <circle cx="35" cy="45" r="3" fill="#FF6B35" id="rightHeel"/>
  </g>

  <!-- Form guidance lines -->
  <g id="formGuides" opacity="0.3">
    <!-- Vertical alignment line -->
    <line x1="200" y1="50" x2="200" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
    <!-- Knee alignment indicators -->
    <circle cx="175" cy="210" r="8" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.5"/>
    <circle cx="225" cy="210" r="8" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Progress bar for hold duration -->
  <g id="holdProgress" transform="translate(100, 270)">
    <rect x="0" y="0" width="200" height="8" rx="4" fill="#E0E0E0"/>
    <rect x="0" y="0" width="0" height="8" rx="4" fill="url(#progressGradient)" id="progressFill"/>
    <text x="100" y="-5" text-anchor="middle" font-size="12" fill="#666">Hold for 3 breaths</text>
  </g>

  <!-- Instructions -->
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="14" fill="#666" id="instruction">
    Feet shoulder-width apart, heels down, hold 3 breaths
  </text>
</svg>