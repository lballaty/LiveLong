<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="exercise-svg">
  <defs>
    <!-- Gradient for breathing circle -->
    <radialGradient id="breathingGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#2196F3;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:0.9" />
    </radialGradient>

    <!-- Exhale gradient -->
    <radialGradient id="exhaleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#4CAF50;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:0.9" />
    </radialGradient>

    <!-- Progress ring -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#FAFAFA" rx="8"/>

  <!-- Central breathing circle -->
  <g id="breathingCircle" transform="translate(200, 150)">
    <!-- Outer ring for progress -->
    <circle id="progressRing"
            cx="0" cy="0" r="80"
            fill="none"
            stroke="#E0E0E0"
            stroke-width="4"/>

    <!-- Progress indicator -->
    <circle id="progressIndicator"
            cx="0" cy="0" r="80"
            fill="none"
            stroke="#2196F3"
            stroke-width="4"
            stroke-dasharray="0 502.65"
            stroke-linecap="round"
            transform="rotate(-90)"
            filter="url(#glow)"/>

    <!-- Main breathing circle -->
    <circle id="mainCircle"
            cx="0" cy="0" r="40"
            fill="url(#breathingGradient)"
            stroke="#1976D2"
            stroke-width="2"
            opacity="0.9"/>

    <!-- Center dot for focus -->
    <circle cx="0" cy="0" r="4" fill="#1976D2" opacity="0.8"/>
  </g>

  <!-- Instruction text -->
  <g id="instructionText" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="200" y="50"
          font-size="24"
          font-weight="bold"
          fill="#333"
          id="exerciseTitle">Breathing Exercise</text>

    <text x="200" y="80"
          font-size="18"
          fill="#666"
          id="exerciseSubtitle">Follow the circle</text>

    <!-- Dynamic breathing instruction -->
    <text x="200" y="260"
          font-size="20"
          font-weight="600"
          fill="#1976D2"
          id="breathingInstruction">Get Ready</text>
  </g>

  <!-- Breathing count -->
  <g id="breathingCounter" transform="translate(350, 50)">
    <circle cx="0" cy="0" r="25" fill="#FFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="0" y="8"
          text-anchor="middle"
          font-size="16"
          font-weight="bold"
          fill="#333"
          id="breathCount">0</text>
    <text x="0" y="-15"
          text-anchor="middle"
          font-size="12"
          fill="#666">Breaths</text>
  </g>

  <!-- Timer integration circle -->
  <g id="timerDisplay" transform="translate(50, 50)">
    <circle cx="0" cy="0" r="30" fill="#FFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="0" y="8"
          text-anchor="middle"
          font-size="18"
          font-weight="bold"
          fill="#333"
          id="remainingTime">120</text>
    <text x="0" y="-20"
          text-anchor="middle"
          font-size="10"
          fill="#666">Seconds</text>
  </g>
</svg>